# SMOKE TEST ONLY: proves the 4B model loads on the 8 GB laptop, the paired dataset is read, a few steps train,
# and a checkpoint and a sample get written. 10 steps; the result is thrown away.
#
# Same model/memory settings as train_klein4b_edit.yaml, so peak VRAM here is representative.
# Its dataset is identity pairs (guide -> same guide) from 4 TRAIN-patient guides, built through the real
# build_dataset.py (see docs/lora-local.md, "Smoke test").
#
#   .venv-lora/Scripts/python scripts/lora/run_aitk.py scripts/lora/smoke_klein4b_edit.yaml
job: extension
config:
  name: "cortexview_klein4b_smoke"
  process:
    - type: 'sd_trainer'
      training_folder: "${PLIE}/lora_work/smoke_output"
      device: cuda:0
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: float16
        save_every: 10
        max_step_saves_to_keep: 1
        push_to_hub: false
      datasets:
        - folder_path: "${PLIE}/lora_work/smoke_dataset/target"
          control_path: "${PLIE}/lora_work/smoke_dataset/reference"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 512 ]
          num_workers: 0
      train:
        batch_size: 1
        steps: 10
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        cache_text_embeddings: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        timestep_type: "weighted"
        dtype: bf16
        skip_first_sample: true
      model:
        name_or_path: "${PLIE}/models/flux2-klein-base-4b"
        arch: "flux2_klein_4b"
        quantize: true
        qtype: "qfloat8"
        quantize_te: true
        qtype_te: "qfloat8"
        low_vram: true
        model_kwargs:
          match_target_res: false
      sample:
        sampler: "flowmatch"
        sample_every: 10
        sample_start_step: 0
        width: 512
        height: 512
        prompts:
          - "turn this brain segmentation map into a CRTXV1EW illustration  --ctrl_img ${PLIE}/data/guides/remind/guide/ReMIND-013_s079.png"
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 4
        sample_steps: 20
meta:
  name: "[name]"
  version: '1.0'
